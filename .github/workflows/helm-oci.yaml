name: Helm OCI

on:
  workflow_call:
    inputs:
      chart_path:
        description: 'Path to Helm chart directory'
        required: false
        type: string
        default: '.'
      registry:
        description: 'OCI registry'
        required: false
        type: string
        default: 'ghcr.io'
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username (optional, uses github.actor for ghcr.io)'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password (optional, uses github.token for ghcr.io)'
        required: false
      GITOPS_APP_ID:
        description: 'GitHub App ID for GitOps updates (optional, only needed if gitops-image-replacer.json exists)'
        required: false
      GITOPS_APP_PRIVATE_KEY:
        description: 'GitHub App private key for GitOps updates (optional, only needed if gitops-image-replacer.json exists)'
        required: false
    outputs:
      version:
        description: 'Released version'
        value: ${{ jobs.release.outputs.version }}
      chart:
        description: 'Full chart reference'
        value: ${{ jobs.release.outputs.chart }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      chart: ${{ steps.push.outputs.chart }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/github conventional-changelog-conventionalcommits

      - name: Use default config if none exists
        run: |
          if [ ! -f .releaserc.json ] && [ ! -f .releaserc ] && [ ! -f .releaserc.yaml ] && [ ! -f .releaserc.yml ] && [ ! -f release.config.js ]; then
            cat > .releaserc.json << 'EOF'
          {
            "branches": ["main", "master"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {"preset": "conventionalcommits"}],
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF
          fi

      - name: Semantic Release
        id: semantic
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            OUTPUT=$(npx semantic-release 2>&1) || true
            echo "$OUTPUT"
            VERSION=$(echo "$OUTPUT" | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
            echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Determine version
        id: version
        env:
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ -n "${NEW_RELEASE_VERSION}" ]; then
            echo "version=${NEW_RELEASE_VERSION}" >> $GITHUB_OUTPUT
          else
            # For develop/feature branches: 0.0.0-<short-sha>
            echo "version=0.0.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Update Chart.yaml version
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          yq -i '.version = strenv(CHART_VERSION)' "${CHART_PATH}/Chart.yaml"
          cat "${CHART_PATH}/Chart.yaml"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v4.3.2'

      - name: Login to OCI Registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
            echo "${REGISTRY_PASSWORD}" | helm registry login "${REGISTRY}" \
              --username "${REGISTRY_USERNAME}" \
              --password-stdin
          else
            echo "${GH_TOKEN}" | helm registry login "${REGISTRY}" \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          fi

      - name: Package Helm chart
        env:
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          helm package "${CHART_PATH}" --destination .helm-packages

      - name: Push to OCI Registry
        id: push
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          CHART_NAME=$(yq '.name' "${CHART_PATH}/Chart.yaml")
          CHART_PACKAGE=".helm-packages/${CHART_NAME}-${CHART_VERSION}.tgz"

          helm push "${CHART_PACKAGE}" "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}"

          echo "chart=oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${CHART_NAME}:${CHART_VERSION}" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          CHART: ${{ steps.push.outputs.chart }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## Helm Chart Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** ${CHART}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${CHART_VERSION}" >> $GITHUB_STEP_SUMMARY

  gitops:
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for GitOps config
        id: config
        run: |
          if [ -f "gitops-image-replacer.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No gitops-image-replacer.json found, skipping GitOps update"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.config.outputs.exists == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install gitops-image-replacer
        if: steps.config.outputs.exists == 'true'
        run: pip install gitops-image-replacer

      - name: Update GitOps repository
        if: steps.config.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART: ${{ needs.release.outputs.chart }}
        run: |
          gitops-image-replacer --ci --apply "${CHART}"
